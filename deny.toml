[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "unmaintained transitive dependency with no upgrade, Linux only; revisit when wry moves to GTK4" },
    { id = "RUSTSEC-2026-0370", reason = "unmaintained transitive dependency with no upgrade, Linux only; revisit when accesskit updates" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained transitive dependency with no upgrade, Linux only; revisit when accesskit updates" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained transitive dependency with no upgrade, Linux only; revisit when accesskit updates" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by wry's GTK3 stack, Linux only; we never use VariantStrIter; revisit when wry moves to GTK4" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
