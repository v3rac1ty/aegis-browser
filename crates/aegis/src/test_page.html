<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Aegis request test</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px sans-serif; margin: 32px; background: Canvas; color: CanvasText; }
  .row { display: flex; align-items: center; gap: 20px; margin: 24px 0; }
  img { width: 120px; height: 120px; object-fit: contain; }
</style>
<h1>Image request test</h1>
<p>The second image should be blocked.</p>
<div class="row">
  <img src="https://www.rust-lang.org/static/images/rust-logo-blk.svg"
       onload="document.getElementById('plain').textContent='loaded'"
       onerror="document.getElementById('plain').textContent='failed'">
  <span>Plain image: <strong id="plain">waiting</strong></span>
</div>
<div class="row">
  <img src="https://www.rust-lang.org/static/images/rust-logo-blk.svg?aegis-block"
       onload="document.getElementById('blocked').textContent='loaded'"
       onerror="document.getElementById('blocked').textContent='failed'">
  <span>Blocking probe: <strong id="blocked">waiting</strong></span>
</div>
</html>
